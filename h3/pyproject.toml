[build-system]
requires = ["setuptools", "setuptools-rust"]
build-backend = "setuptools.build_meta"

[project]
name = "daft-h3"
version = "0.1.0"
description = "H3 geospatial indexing functions for Daft"
requires-python = ">=3.10"
dependencies = ["daft>=0.7.5"]
license = {text = "Apache-2.0"}

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/daft-engine/daft-extensions"
